<!--
  Banco de pruebas de la consola.

  Sirve para mirar una pantalla sin levantar el sistema completo ni
  capturar un servicio a mano: se cargan los MODULOS DE VERDAD y se les
  contesta la API con datos de mentira, con la forma exacta que devuelve
  el servidor.

  No reemplaza probar con datos reales. Lo que atrapa es lo que ninguna
  prueba automatica ve: que un boton quede donde debe, que una tabla no
  se desborde, que una traduccion larga no parta el renglon.

    /consola/banco.html?p=finanzas&i=es
    /consola/banco.html?p=servicio&i=en

  Las rutas que no esten aqui se contestan vacias y se anotan en la
  consola del navegador, para saber que falta agregar.
-->

window.fetch = async (ruta) => {
  const limpia = String(ruta).split("?")[0];
  let datos = RUTAS[limpia];
  if (datos === undefined) {
    faltantes.add(limpia);
    console.warn("[banco] sin datos para", limpia);
    datos = limpia.match(/asignaciones|recomendaciones|revisiones|reemplazos/)
      ? [] : {};
  }
  return new Response(JSON.stringify(datos),
    { status: 200, headers: { "Content-Type": "application/json" } });
};
