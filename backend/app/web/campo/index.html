<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- El nombre que sale debajo del icono en el telefono (seccion 72):
     iOS lo toma de aqui; Android, del manifiesto. -->
<meta name="apple-mobile-web-app-title" content="EP Connect">
<title>EP Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;650;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/app/manifiesto.json">
<!-- iOS no lee los iconos del manifiesto: los toma de aqui. Y sin
     icono no hay "Agregar a inicio", sin eso no hay app instalada,
     y sin app instalada el iPhone no recibe un solo aviso. -->
<link rel="apple-touch-icon" href="/app/icono-apple-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/app/icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/app/icono-192.png">
<link rel="stylesheet" href="/app/estilo.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="/app/app.js"></script>
</body>
</html>
