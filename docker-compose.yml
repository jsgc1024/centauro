# La zona horaria de los contenedores.
#
# Desde que `Pais` guarda su zona horaria, cada servicio se juzga con el
# reloj de su pais y no con el del contenedor: eso lo resuelve
# `app/reloj.py`, no esta linea. Lo que queda aqui es la hora de la casa
# —Mexico—, la que se usa cuando no hay un pais de por medio: el
# encabezado de una pantalla, el calendario de Celery, el ancho de las
# consultas que mezclan paises.
#
# Sin ella docker levanta en UTC y esa hora de la casa quedaria seis
# horas corrida. Se queda.
#
# ATENCION: este archivo es de DESARROLLO. Publica Postgres y Redis al
# exterior, trae la contrasena de la base a la vista, monta el codigo
# desde el disco y corre uvicorn con --reload. Para el servidor de
# produccion, ver ARQUITECTURA.md.

services:
  db:
    image: postgres:16
    container_name: centauro_db
    environment:
      POSTGRES_USER: centauro
      POSTGRES_PASSWORD: centauro_dev
      POSTGRES_DB: centauro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centauro"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: centauro_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: centauro_api
    environment:
      TZ: America/Mexico_City
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/code
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: centauro_worker
    environment:
      TZ: America/Mexico_City
    command: celery -A app.celery_app.celery worker --loglevel=info
    volumes:
      - ./backend:/code
    env_file: .env
    depends_on:
      - redis
      - db

  # El reloj: dispara las tareas programadas (hoy, abrir el mes siguiente
  # de los implantados). Va aparte del worker para que reiniciar uno no
  # se lleve al otro.
  beat:
    build: ./backend
    container_name: centauro_beat
    environment:
      TZ: America/Mexico_City
    command: celery -A app.celery_app.celery beat --loglevel=info
    volumes:
      - ./backend:/code
    env_file: .env
    depends_on:
      - redis
      - db

volumes:
  pgdata:
