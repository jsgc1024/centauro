# La zona horaria de los contenedores.
#
# Todo el sistema decide con un solo reloj —el del servidor— y `Pais` no
# guarda zona horaria. Sin esta linea, docker levanta en UTC y entonces
# el corte de las 18:00 de la central cae a las 12:00 en CDMX, las
# ventanas de marcado se corren seis horas, y la lista de dias sin
# cerrar puede ofrecer un dia que todavia esta corriendo.
#
# Esto alinea todo para Mexico, que es donde esta la operacion. Brasil y
# Venezuela siguen pendientes: necesitan zona por pais, que es un cambio
# de fondo y no una linea de configuracion.

services:
  db:
    image: postgres:16
    container_name: centauro_db
    environment:
      POSTGRES_USER: centauro
      POSTGRES_PASSWORD: centauro_dev
      POSTGRES_DB: centauro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centauro"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: centauro_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: centauro_api
    environment:
      TZ: America/Mexico_City
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/code
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: centauro_worker
    environment:
      TZ: America/Mexico_City
    command: celery -A app.celery_app.celery worker --loglevel=info
    volumes:
      - ./backend:/code
    env_file: .env
    depends_on:
      - redis
      - db

  # El reloj: dispara las tareas programadas (hoy, abrir el mes siguiente
  # de los implantados). Va aparte del worker para que reiniciar uno no
  # se lleve al otro.
  beat:
    build: ./backend
    container_name: centauro_beat
    environment:
      TZ: America/Mexico_City
    command: celery -A app.celery_app.celery beat --loglevel=info
    volumes:
      - ./backend:/code
    env_file: .env
    depends_on:
      - redis
      - db

volumes:
  pgdata:
